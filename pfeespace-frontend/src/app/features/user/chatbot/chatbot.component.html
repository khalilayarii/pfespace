<!-- BULLE -->
<div class="chat-fab" (click)="toggleChat()" [class.fab-open]="isOpen">
  <svg *ngIf="!isOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  <svg *ngIf="isOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
  <span class="fab-badge" *ngIf="!isOpen && unreadCount > 0">{{ unreadCount }}</span>
</div>

<!-- FENÊTRE -->
<div class="chat-window" [class.chat-window-open]="isOpen">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="header-left">
      <div class="header-avatar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div>
        <h2>Assistant PfeSpace</h2>
        <span class="status"><span class="status-dot"></span>En ligne</span>
      </div>
    </div>
    <button class="btn-clear" (click)="clearHistory()" title="Nouvelle conversation">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-3.9"/>
      </svg>
    </button>
  </div>

  <!-- MESSAGES -->
  <div class="messages-container">

    <div class="suggestions-grid" *ngIf="showSuggestions">
      <p class="suggestions-title">Suggestions rapides</p>
      <button class="suggestion-btn" *ngFor="let s of suggestionsRapides" (click)="sendSuggestion(s)">
        <span class="suggestion-icon">{{ s.icon }}</span>
        <span>{{ s.label }}</span>
      </button>
    </div>

    <div *ngFor="let msg of messages"
         class="message"
         [ngClass]="msg.role === 'user' ? 'user-msg' : 'bot-msg'">
      <div class="bot-avatar" *ngIf="msg.role === 'bot'">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="bubble" [class.user-bubble]="msg.role==='user'" [class.bot-bubble]="msg.role==='bot'">
        <span *ngIf="msg.role === 'bot'" [innerHTML]="formatMessage(msg.text)"></span>
        <span *ngIf="msg.role === 'user'">{{ msg.text }}</span>
      </div>
    </div>

    <div class="message bot-msg" *ngIf="loading">
      <div class="bot-avatar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="bubble bot-bubble typing">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div #messagesEnd></div>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <input #inputRef type="text" [(ngModel)]="userInput"
           (keydown)="onKeyDown($event)"
           placeholder="Posez votre question..."
           [disabled]="loading" />
    <button (click)="sendMessage()" [disabled]="loading || !userInput.trim()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>

</div>
